<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 560" width="1208" height="560" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif">
  <!-- academic-ja 用サンプル図。viewBox 1208×560・最小 font-size 18 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8d1dc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1208" height="560" fill="#ffffff"/>

  <!-- 協働する段はうっすら地色を敷く -->
  <rect x="16" y="312" width="1176" height="78" fill="#fdf7e8"/>

  <!-- ── 列見出し ───────────────────────────────────────────── -->
  <g font-size="18" font-weight="700" fill="#5a6474">
    <text x="82" y="46">担い手</text>
    <text x="244" y="46">手順</text>
    <text x="630" y="46">補足</text>
  </g>
  <line x1="16" y1="60" x2="1192" y2="60" stroke="#c8d1dc" stroke-width="2"/>

  <!-- ── 流れの背骨 ─────────────────────────────────────────── -->
  <line x1="43" y1="80" x2="43" y2="548" stroke="#c8d1dc" stroke-width="2" marker-end="url(#ah)"/>
  <g fill="#ffffff" stroke="#2c5f8a" stroke-width="2">
    <circle cx="43" cy="111" r="18"/>
    <circle cx="43" cy="191" r="18"/>
    <circle cx="43" cy="271" r="18"/>
    <circle cx="43" cy="351" r="18"/>
    <circle cx="43" cy="431" r="18"/>
    <circle cx="43" cy="511" r="18"/>
  </g>
  <g font-size="20" font-weight="700" fill="#2c5f8a" text-anchor="middle">
    <text x="43" y="118">1</text>
    <text x="43" y="198">2</text>
    <text x="43" y="278">3</text>
    <text x="43" y="358">4</text>
    <text x="43" y="438">5</text>
    <text x="43" y="518">6</text>
  </g>

  <!-- ── 担い手のチップ ─────────────────────────────────────── -->
  <!-- 研究者: 紺ベタ / AI: 淡い紺 / 両者: ゴールド -->
  <g stroke-width="1.5">
    <rect x="82" y="94" width="140" height="34" rx="17" fill="#2c5f8a" stroke="#2c5f8a"/>
    <rect x="82" y="174" width="140" height="34" rx="17" fill="#2c5f8a" stroke="#2c5f8a"/>
    <rect x="82" y="254" width="140" height="34" rx="17" fill="#e8f0f8" stroke="#c8d1dc"/>
    <rect x="82" y="334" width="140" height="34" rx="17" fill="#d4a843" stroke="#c9973a"/>
    <rect x="82" y="414" width="140" height="34" rx="17" fill="#e8f0f8" stroke="#c8d1dc"/>
    <rect x="82" y="494" width="140" height="34" rx="17" fill="#2c5f8a" stroke="#2c5f8a"/>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <text x="152" y="117" fill="#ffffff">研究者</text>
    <text x="152" y="197" fill="#ffffff">研究者</text>
    <text x="152" y="277" fill="#2c5f8a">AI</text>
    <text x="152" y="357" fill="#1a1a2e">研究者＋AI</text>
    <text x="152" y="437" fill="#2c5f8a">AI</text>
    <text x="152" y="517" fill="#ffffff">研究者</text>
  </g>

  <!-- ── 手順 ───────────────────────────────────────────────── -->
  <g font-size="21" font-weight="700" fill="#1a1a2e">
    <text x="244" y="118">ベースとなる成果物を選ぶ</text>
    <text x="244" y="198">使用するテーマを選ぶ</text>
    <text x="244" y="278">叩き台を Marp記法で出させる</text>
    <text x="244" y="358">文言と図の修正を往復で進める</text>
    <text x="244" y="438">PDF と PPTX を出力させる</text>
    <text x="244" y="518">配置などを自分で微調整する</text>
  </g>

  <!-- ── 補足 ───────────────────────────────────────────────── -->
  <g font-size="19" fill="#5a6474">
    <text x="630" y="118">論文・レポートなど、発表の元にするもの</text>
    <text x="630" y="198">academic-ja / academic-intl / 授業用</text>
    <text x="630" y="278">まず一通り形にする。細部はここで詰めない</text>
    <text x="630" y="438">/build-slide で出力。PPTX は既定で画像固定</text>
    <text x="630" y="518">PowerPoint の Claude アドインと手作業で</text>
  </g>
  <!-- 4段目だけは条件分岐なので強調色で書く -->
  <text x="630" y="358" font-size="19" fill="#b5540e">イメージと違えば人が下書きしてAIが図解作成（SVG）</text>
  <!-- 5段目の但し書き -->
  <text x="630" y="462" font-size="18" fill="#b5540e">オプションで編集可能な PPTX にもできる</text>
</svg>
