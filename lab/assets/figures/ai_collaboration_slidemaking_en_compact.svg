<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 165" width="1160" height="165" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <!-- Short form of ai_collaboration_slidemaking_en.svg, for figure-layout.
       viewBox 1160x165, smallest font-size 20.
       Note: an XML comment may not contain two consecutive hyphens. -->

  <rect x="0" y="0" width="1160" height="165" fill="#ffffff"/>

  <!-- step names -->
  <g font-size="20" font-weight="600" fill="#1a1a2e" text-anchor="middle">
    <text x="98" y="44">Pick source</text>
    <text x="291" y="44">Pick theme</text>
    <text x="484" y="44">Draft in Marp</text>
    <text x="677" y="44">Revise</text>
    <text x="870" y="44">Export</text>
    <text x="1063" y="44">Adjust</text>
  </g>

  <!-- who, as a band -->
  <g stroke-width="1.5">
    <rect x="8"    y="60" width="181" height="50" rx="4" fill="#1f4e79" stroke="#1f4e79"/>
    <rect x="201"  y="60" width="181" height="50" rx="4" fill="#1f4e79" stroke="#1f4e79"/>
    <rect x="394"  y="60" width="181" height="50" rx="4" fill="#eef3f8" stroke="#c8d1dc"/>
    <rect x="587"  y="60" width="181" height="50" rx="4" fill="#e0a955" stroke="#c9973a"/>
    <rect x="780"  y="60" width="181" height="50" rx="4" fill="#eef3f8" stroke="#c8d1dc"/>
    <rect x="973"  y="60" width="181" height="50" rx="4" fill="#1f4e79" stroke="#1f4e79"/>
  </g>

  <g font-size="20" font-weight="700" text-anchor="middle">
    <text x="98"   y="92" fill="#ffffff">1</text>
    <text x="291"  y="92" fill="#ffffff">2</text>
    <text x="484"  y="92" fill="#1f4e79">3</text>
    <text x="677"  y="92" fill="#1a1a2e">4</text>
    <text x="870"  y="92" fill="#1f4e79">5</text>
    <text x="1063" y="92" fill="#ffffff">6</text>
  </g>

  <!-- carets between steps -->
  <g fill="#c8d1dc">
    <path d="M 191 79 L 199 85 L 191 91 z"/>
    <path d="M 384 79 L 392 85 L 384 91 z"/>
    <path d="M 577 79 L 585 85 L 577 91 z"/>
    <path d="M 770 79 L 778 85 L 770 91 z"/>
    <path d="M 963 79 L 971 85 L 963 91 z"/>
  </g>

  <!-- who -->
  <g font-size="20" font-weight="600" text-anchor="middle">
    <text x="98"   y="140" fill="#1f4e79">Researcher</text>
    <text x="291"  y="140" fill="#1f4e79">Researcher</text>
    <text x="484"  y="140" fill="#5a6474">AI</text>
    <text x="677"  y="140" fill="#b5540e">Both</text>
    <text x="870"  y="140" fill="#5a6474">AI</text>
    <text x="1063" y="140" fill="#1f4e79">Researcher</text>
  </g>
</svg>
